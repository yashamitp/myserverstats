version: '3.8'

services:
  agentops-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-${CLERK_PUBLISHABLE_KEY:-}}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    container_name: agentops-app
    restart: unless-stopped
    ports:
      # In production, bind strictly to localhost (127.0.0.1) so Nginx reverse proxy handles public access
      - "127.0.0.1:5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOW_PRIVATE_NETWORKS=${ALLOW_PRIVATE_NETWORKS:-false}
      - MONITORING_INTERVAL_SEC=${MONITORING_INTERVAL_SEC:-10}
      - MAX_CONCURRENT_CHECKS=${MAX_CONCURRENT_CHECKS:-10}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-${CLERK_PUBLISHABLE_KEY:-}}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:-${VITE_CLERK_PUBLISHABLE_KEY:-}}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      # AI Provider Configuration
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gemini-2.5-flash}
    networks:
      - agentops-network

  # Optional local MongoDB container (activated only when explicitly using --profile local-mongo)
  mongodb:
    image: mongo:7.0
    container_name: agentops-mongodb
    restart: unless-stopped
    profiles:
      - local-mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agentops-network

volumes:
  mongo-data:

networks:
  agentops-network:
    driver: bridge
