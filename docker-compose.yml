version: '3.8'

services:
  agentops-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentops-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/agentops}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOW_PRIVATE_NETWORKS=${ALLOW_PRIVATE_NETWORKS:-false}
      - MONITORING_INTERVAL_SEC=${MONITORING_INTERVAL_SEC:-10}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5000}
      # Optional AI Provider Configuration
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - agentops-network

  # Internal persistent database (not exposed to host network)
  mongodb:
    image: mongo:7.0
    container_name: agentops-mongodb
    restart: unless-stopped
    # Port 27017 is NOT mapped to the host to keep database access internal to Docker network
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agentops-network

volumes:
  mongo-data:

networks:
  agentops-network:
    driver: bridge
