version: '3.8'

services:
  agentops-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentops-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/agentops
      - JWT_SECRET=change_me_to_a_random_production_secret_32chars!
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - ALLOW_PRIVATE_NETWORKS=false
      - MONITORING_INTERVAL_SEC=10
      - CORS_ORIGIN=http://localhost:5000
      # Optional AI provider configuration
      # - AI_PROVIDER=openai
      # - AI_API_KEY=sk-...
      # - AI_MODEL=gpt-4o-mini
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - agentops-network

  mongodb:
    image: mongo:7.0
    container_name: agentops-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agentops-network

volumes:
  mongo-data:

networks:
  agentops-network:
    driver: bridge
